<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <title>Gerador de Ícones</title>
    <meta name="author" content="spilymp">
    <meta name="description"
        content="Um construtor de ícones simples, que oferece a capacidade de criar ícones de aplicativos no estilo dos ícones de aplicativos do sistema WETH.">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="css/milligram.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script type="text/javascript" src="js/material_icons_catalog.js"></script>
    <script type="text/javascript" src="js/weth_icon.js"></script>

    <script>
        let currentIcon = null;
        let currentCategory = 'all';
        let searchQuery = '';
        let renderedCount = 0;
        const CHUNK_SIZE = 120;
        let filteredIcons = [];

        document.addEventListener("DOMContentLoaded", function () {
            currentIcon = new WETH_ICON({
                'font_family': 'Material Symbols Outlined',
                'icon_class': 'person',
                'font_weight': '300',
                'icon_width': '200',
                'font_size': '140'
            });
            currentIcon.draw("icon");

            initCatalog();

            // Sincronização em tempo real quando o usuário digita no input
            let inputDebounce = null;
            document.getElementById('iconClass').addEventListener('input', function (e) {
                clearTimeout(inputDebounce);
                inputDebounce = setTimeout(() => {
                    const val = e.target.value.trim();
                    updateCardSelection(val);
                    generate();
                }, 100);
            });
        });

        function getCurrentIconInstance() {
            let iconValue = document.getElementById('iconClass').value.trim();
            if (!iconValue) {
                iconValue = 'person';
            }
            return new WETH_ICON({
                'font_color': document.getElementById('iconFontColor').value,
                'font_family': 'Material Symbols Outlined',
                'font_weight': '300',
                'icon_background': document.getElementById('iconBackgroundColor').value,
                'icon_class': iconValue,
                'icon_width': '200',
                'font_size': '140'
            });
        }

        function generate() {
            document.getElementById("icon").innerHTML = '';
            currentIcon = getCurrentIconInstance();
            currentIcon.draw("icon");
        }

        function downloadPNG() {
            if (!currentIcon) {
                currentIcon = getCurrentIconInstance();
            }
            let dataUrl = currentIcon.exportPNG(128);
            let link = document.createElement('a');
            link.href = dataUrl;
            link.download = 'icon.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadSVG() {
            if (!currentIcon) {
                currentIcon = getCurrentIconInstance();
            }
            let svgData = currentIcon.generateSVG(50);
            let blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            let link = document.createElement('a');
            link.href = url;
            link.download = 'icon.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function initCatalog() {
            if (typeof MATERIAL_ICONS_CATALOG === 'undefined') return;

            const categoriesContainer = document.getElementById('catalogCategories');
            categoriesContainer.innerHTML = '';

            // Chip "Todos"
            const allChip = document.createElement('button');
            allChip.type = 'button';
            allChip.className = 'category-chip active';
            allChip.textContent = `Todos (${MATERIAL_ICONS_CATALOG.icons.length})`;
            allChip.onclick = () => selectCategory('all', allChip);
            categoriesContainer.appendChild(allChip);

            // Contagem por categoria
            const catCounts = {};
            for (const icon of MATERIAL_ICONS_CATALOG.icons) {
                catCounts[icon.c] = (catCounts[icon.c] || 0) + 1;
            }

            for (const [code, label] of Object.entries(MATERIAL_ICONS_CATALOG.categories)) {
                const count = catCounts[code] || 0;
                if (count === 0) continue;
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'category-chip';
                chip.textContent = `${label} (${count})`;
                chip.onclick = () => selectCategory(code, chip);
                categoriesContainer.appendChild(chip);
            }

            filterIcons();

            // Scroll infinito no container da grade
            const grid = document.getElementById('catalogGrid');
            grid.addEventListener('scroll', () => {
                if (grid.scrollTop + grid.clientHeight >= grid.scrollHeight - 160) {
                    renderNextChunk();
                }
            });

            // Campo de busca em tempo real
            const searchInput = document.getElementById('catalogSearch');
            let searchDebounce = null;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(() => {
                    searchQuery = e.target.value.trim().toLowerCase();
                    filterIcons();
                }, 100);
            });
        }

        function selectCategory(cat, chipElement) {
            currentCategory = cat;
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            if (chipElement) chipElement.classList.add('active');
            filterIcons();
        }

        function filterIcons() {
            if (typeof MATERIAL_ICONS_CATALOG === 'undefined') return;

            filteredIcons = MATERIAL_ICONS_CATALOG.icons.filter(icon => {
                const matchesCategory = (currentCategory === 'all' || icon.c === currentCategory);
                if (!matchesCategory) return false;

                if (!searchQuery) return true;
                return icon.n.includes(searchQuery) || icon.t.includes(searchQuery);
            });

            const counter = document.getElementById('catalogCounter');
            if (counter) {
                counter.textContent = `${filteredIcons.length} ícone${filteredIcons.length === 1 ? '' : 's'} encontrado${filteredIcons.length === 1 ? '' : 's'}`;
            }

            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';
            renderedCount = 0;

            if (filteredIcons.length === 0) {
                grid.innerHTML = '<div class="catalog-empty">Nenhum ícone encontrado para esta pesquisa.</div>';
                return;
            }

            renderNextChunk();
        }

        function renderNextChunk() {
            if (renderedCount >= filteredIcons.length) return;
            const grid = document.getElementById('catalogGrid');
            const fragment = document.createDocumentFragment();

            const currentVal = document.getElementById('iconClass').value.trim() || 'person';
            const nextChunk = filteredIcons.slice(renderedCount, renderedCount + CHUNK_SIZE);

            for (const icon of nextChunk) {
                const card = document.createElement('div');
                card.className = 'icon-card' + (icon.n === currentVal ? ' active' : '');
                card.dataset.name = icon.n;
                card.title = icon.n;

                card.innerHTML = `
                    <span class="icon-card-glyph">${icon.n}</span>
                    <span class="icon-card-name">${icon.n}</span>
                `;

                card.onclick = () => selectIcon(icon.n);
                fragment.appendChild(card);
            }

            grid.appendChild(fragment);
            renderedCount += nextChunk.length;
        }

        function selectIcon(iconName) {
            const input = document.getElementById('iconClass');
            input.value = iconName;
            updateCardSelection(iconName);
            generate();
        }

        function updateCardSelection(iconName) {
            document.querySelectorAll('.icon-card').forEach(c => {
                if (c.dataset.name === iconName) {
                    c.classList.add('active');
                } else {
                    c.classList.remove('active');
                }
            });
        }
    </script>
</head>

<body>
    <div class="font_preload" style="opacity: 0">
        <span style="font-family: 'Material Symbols Outlined', Arial, sans-serif;"></span>
    </div>

    <header class="container">
        <div class="row">
            <div class="column align-center">
                <img src="assets/images/logo.png" alt="Logotipo WETH" style="max-width: 350px; height: auto;">
                <h1>Gerador de Ícones</h1>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="row row-center">
            <div class="column align-center settings-card front">
                <div class="row icon-set-website">
                    <div class="column column-center column-50">
                        <label for="iconClass">Ícone Material</label>
                    </div>
                    <div class="column column-40">
                        <input id="iconClass" type="text" placeholder="ex. person, home, settings">
                    </div>
                    <div class="column">
                        <a href="https://fonts.google.com/icons" id="iconSetWebsite" class="button button-outline"
                            target="_blank">
                            <i class="material-symbols-outlined button-icon">language</i>
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="column column-center">
                        <label for="iconBackgroundColor">Cor do Background</label>
                    </div>
                    <div class="column">
                        <input type="color" value="#05285B" id="iconBackgroundColor" oninput="generate()">
                    </div>
                </div>
                <div class="row">
                    <div class="column column-center">
                        <label for="iconFontColor">Cor da Fonte</label>
                    </div>
                    <div class="column">
                        <input id="iconFontColor" type="color" value="#ffffff" oninput="generate()">
                    </div>
                </div>
                <div class="row">
                    <div class="column align-right">
                        <button class="button button-outline" type="button" title="Gerar" onclick="generate()">
                            <i class="material-symbols-outlined button-icon">play_arrow</i>
                        </button>
                        <button type="button" onclick="downloadPNG()">PNG</button>
                        <button type="button" class="button button-outline" onclick="downloadSVG()">SVG</button>
                    </div>
                </div>
            </div>

            <div class="column align-center">
                <div id="icon"></div>
            </div>
        </div>
    </div>

    <section class="container">
        <div class="catalog-section">
            <div class="catalog-header">
                <h2>
                    <span class="material-symbols-outlined" style="font-size: 2.6rem; vertical-align: middle;">category</span>
                    Catálogo de Ícones Material
                </h2>
                <span id="catalogCounter" class="catalog-counter">Carregando catálogo...</span>
            </div>

            <div class="catalog-search-wrap">
                <input type="text" id="catalogSearch" class="catalog-search-input"
                    placeholder="🔍 Buscar ícones por nome ou palavra-chave (ex.: person, settings, receipt, inventory, cart)..."
                    autocomplete="off">
            </div>

            <div id="catalogCategories" class="catalog-categories">
                <!-- Categorias oficiais geradas dinamicamente -->
            </div>

            <div id="catalogGrid" class="catalog-grid">
                <!-- Cards de ícones interativos gerados dinamicamente -->
            </div>
        </div>
    </section>

    <footer class="container">
        <div class="row align-center">
            <div class="column align-center">
                <p>© 2025 <a href="https://weth.com.br"><b>WETH</b></a></p>
            </div>
        </div>
    </footer>
</body>

</html>
