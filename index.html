<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <title>WETH Icon Studio — Gerador de Ícones</title>
    <meta name="author" content="WETH Tecnologia">
    <meta name="description"
        content="Estúdio oficial de criação e padronização visual de ícones para o ecossistema WETH (viewBox 50x50, PNG 128x128).">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="css/milligram.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script type="text/javascript" src="js/material_icons_catalog.js"></script>
    <script type="text/javascript" src="js/weth_icon.js"></script>

    <script>
        let currentIcon = null;
        let currentCategory = 'all';
        let searchQuery = '';
        let renderedCount = 0;
        const CHUNK_SIZE = 120;
        let filteredIcons = [];

        const CATEGORY_ICONS = {
            'all': 'apps',
            'actions': 'bolt',
            'activities': 'sports_soccer',
            'android': 'android',
            'av': 'play_circle',
            'business': 'business_center',
            'communication': 'chat',
            'hardware': 'memory',
            'home': 'home',
            'household': 'cottage',
            'image': 'image',
            'maps': 'map',
            'privacy': 'shield',
            'social': 'group',
            'text': 'edit_note',
            'transit': 'directions_car',
            'travel': 'flight',
            'ui': 'widgets',
            // Fallbacks de compatibilidade legada
            'action': 'bolt',
            'alert': 'warning',
            'content': 'content_paste',
            'device': 'devices',
            'editor': 'edit_note',
            'file': 'folder',
            'notification': 'notifications',
            'places': 'storefront',
            'search': 'search',
            'toggle': 'toggle_on'
        };

        document.addEventListener("DOMContentLoaded", function () {
            currentIcon = new WETH_ICON({
                'font_family': 'Material Symbols Outlined',
                'icon_class': 'person',
                'font_weight': '300',
                'icon_width': '200',
                'font_size': '140'
            });
            currentIcon.draw("icon");

            initCatalog();

            // Sincronização em tempo real quando o usuário digita no input
            let inputDebounce = null;
            document.getElementById('iconClass').addEventListener('input', function (e) {
                clearTimeout(inputDebounce);
                inputDebounce = setTimeout(() => {
                    const val = e.target.value.trim();
                    updateCardSelection(val);
                    generate();
                }, 100);
            });
        });

        function getCurrentIconInstance() {
            let iconValue = document.getElementById('iconClass').value.trim();
            if (!iconValue) {
                iconValue = 'person';
            }
            return new WETH_ICON({
                'font_color': document.getElementById('iconFontColor').value,
                'font_family': 'Material Symbols Outlined',
                'font_weight': '300',
                'icon_background': document.getElementById('iconBackgroundColor').value,
                'icon_class': iconValue,
                'icon_width': '200',
                'font_size': '140'
            });
        }

        function generate() {
            document.getElementById("icon").innerHTML = '';
            currentIcon = getCurrentIconInstance();
            currentIcon.draw("icon");
            if (typeof WETH_ICON.fetchVectorPath === 'function') {
                WETH_ICON.fetchVectorPath(currentIcon.icon_class, currentIcon.font_weight || '300');
            }
        }

        function downloadPNG(resolution = 128) {
            if (!currentIcon) {
                currentIcon = getCurrentIconInstance();
            }
            let dataUrl = currentIcon.exportPNG(resolution);
            let link = document.createElement('a');
            link.href = dataUrl;
            link.download = resolution === 512 ? 'icon-512.png' : 'icon.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadPNGHi() {
            downloadPNG(512);
        }

        async function downloadSVG() {
            if (!currentIcon) {
                currentIcon = getCurrentIconInstance();
            }
            let svgData = await currentIcon.generateSVG(50);
            let blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            let link = document.createElement('a');
            link.href = url;
            link.download = 'icon.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function initCatalog() {
            if (typeof MATERIAL_ICONS_CATALOG === 'undefined') return;

            const categoriesContainer = document.getElementById('catalogCategories');
            categoriesContainer.innerHTML = '';

            // Item "Todos"
            const allItem = createCategoryItem('all', 'Todos', true);
            categoriesContainer.appendChild(allItem);

            // Categorias com uma única palavra
            for (const [code, label] of Object.entries(MATERIAL_ICONS_CATALOG.categories)) {
                const item = createCategoryItem(code, label, false);
                categoriesContainer.appendChild(item);
            }

            filterIcons();

            // Scroll infinito no container da grade
            const scrollContainer = document.getElementById('catalogGridScroll') || document.getElementById('catalogGrid');
            scrollContainer.addEventListener('scroll', () => {
                if (scrollContainer.scrollTop + scrollContainer.clientHeight >= scrollContainer.scrollHeight - 200) {
                    renderNextChunk();
                }
            });

            // Campo de busca em tempo real com normalização de acentos
            const searchInput = document.getElementById('catalogSearch');
            let searchDebounce = null;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(() => {
                    searchQuery = e.target.value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    filterIcons();
                }, 100);
            });
        }

        function createCategoryItem(code, label, isActive) {
            const iconName = CATEGORY_ICONS[code] || 'category';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'category-item' + (isActive ? ' active' : '');
            btn.dataset.category = code;
            btn.innerHTML = `
                <span class="category-icon material-symbols-outlined">${iconName}</span>
                <span class="category-label">${label}</span>
            `;
            btn.onclick = () => selectCategory(code, btn);
            return btn;
        }

        function selectCategory(cat, itemElement) {
            currentCategory = cat;
            document.querySelectorAll('.category-item').forEach(c => c.classList.remove('active'));
            if (itemElement) itemElement.classList.add('active');
            filterIcons();
        }

        function filterIcons() {
            if (typeof MATERIAL_ICONS_CATALOG === 'undefined') return;

            filteredIcons = MATERIAL_ICONS_CATALOG.icons.filter(icon => {
                const matchesCategory = (currentCategory === 'all' || icon.c === currentCategory);
                if (!matchesCategory) return false;

                if (!searchQuery) return true;
                return icon.n.includes(searchQuery) || icon.t.includes(searchQuery);
            });

            const counter = document.getElementById('catalogCounter');
            if (counter) {
                counter.textContent = `${filteredIcons.length} ícone${filteredIcons.length === 1 ? '' : 's'} encontrado${filteredIcons.length === 1 ? '' : 's'}`;
            }

            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';
            renderedCount = 0;

            if (filteredIcons.length === 0) {
                grid.innerHTML = '<div class="catalog-empty">Nenhum ícone encontrado para esta pesquisa.</div>';
                return;
            }

            renderNextChunk();
        }

        function renderNextChunk() {
            if (renderedCount >= filteredIcons.length) return;
            const grid = document.getElementById('catalogGrid');
            const fragment = document.createDocumentFragment();

            const currentVal = document.getElementById('iconClass').value.trim() || 'person';
            const nextChunk = filteredIcons.slice(renderedCount, renderedCount + CHUNK_SIZE);

            for (const icon of nextChunk) {
                const card = document.createElement('div');
                card.className = 'icon-card' + (icon.n === currentVal ? ' active' : '');
                card.dataset.name = icon.n;
                card.title = icon.n;

                card.innerHTML = `
                    <span class="icon-card-glyph">${icon.n}</span>
                    <span class="icon-card-name">${icon.n}</span>
                `;

                card.onclick = () => selectIcon(icon.n);
                fragment.appendChild(card);
            }

            grid.appendChild(fragment);
            renderedCount += nextChunk.length;
        }

        function selectIcon(iconName) {
            const input = document.getElementById('iconClass');
            input.value = iconName;
            updateCardSelection(iconName);
            generate();
        }

        function updateCardSelection(iconName) {
            document.querySelectorAll('.icon-card').forEach(c => {
                if (c.dataset.name === iconName) {
                    c.classList.add('active');
                } else {
                    c.classList.remove('active');
                }
            });
        }

        function updateColorFromPicker(type) {
            if (type === 'bg') {
                const val = document.getElementById('iconBackgroundColor').value;
                document.getElementById('iconBackgroundColorText').value = val.toUpperCase();
            } else {
                const val = document.getElementById('iconFontColor').value;
                document.getElementById('iconFontColorText').value = val.toUpperCase();
            }
            generate();
        }

        function updateColorFromText(type) {
            if (type === 'bg') {
                let val = document.getElementById('iconBackgroundColorText').value.trim();
                if (!val.startsWith('#')) val = '#' + val;
                if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                    document.getElementById('iconBackgroundColor').value = val;
                    generate();
                }
            } else {
                let val = document.getElementById('iconFontColorText').value.trim();
                if (!val.startsWith('#')) val = '#' + val;
                if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                    document.getElementById('iconFontColor').value = val;
                    generate();
                }
            }
        }
    </script>
</head>

<body>
    <header class="studio-topbar">
        <div class="studio-brand">
            <img src="assets/images/logo.png" alt="WETH" class="studio-logo">
            <h1 class="studio-title">
                Gerador de Ícones
            </h1>
        </div>
        <div class="studio-top-actions">
            <a href="https://fonts.google.com/icons" target="_blank" class="btn-topbar">
                <span class="material-symbols-outlined" style="font-size: 1.6rem;">open_in_new</span>
                <span>Google Fonts</span>
            </a>
        </div>
    </header>

    <div class="studio-layout">
        <!-- 1. Left Sidebar: Categorias -->
        <aside class="studio-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Categorias</span>
            </div>
            <div class="category-list" id="catalogCategories">
                <!-- Itens gerados dinamicamente via JS -->
            </div>
        </aside>

        <!-- 2. Central Area: Busca + Grade -->
        <main class="studio-main">
            <div class="studio-search-bar">
                <div class="search-input-wrapper">
                    <span class="search-icon-inside material-symbols-outlined">search</span>
                    <input type="text" id="catalogSearch" class="catalog-search-input"
                        placeholder="Buscar"
                        autocomplete="off">
                </div>
                <span id="catalogCounter" class="catalog-counter-badge">Carregando catálogo...</span>
            </div>

            <div class="studio-grid-scroll" id="catalogGridScroll">
                <div id="catalogGrid" class="catalog-grid">
                    <!-- Cards de ícones gerados dinamicamente -->
                </div>
            </div>
        </main>

        <!-- 3. Right Inspector: Preview + Ajustes + Downloads -->
        <aside class="studio-inspector">
            <div class="inspector-section">
                <span class="inspector-title">Pré-visualização</span>
                <div class="preview-box">
                    <div id="icon"></div>
                </div>
            </div>

            <div class="inspector-section">
                <span class="inspector-title">Personalização</span>

                <div class="control-item">
                    <label for="iconClass" class="control-label">Nome do Ícone</label>
                    <div class="icon-name-input-wrap">
                        <input type="text" id="iconClass" class="icon-name-input" value="person" placeholder="ex. person, home, settings">
                        <a href="https://fonts.google.com/icons" id="iconSetWebsite" class="icon-name-link" target="_blank" title="Abrir no Google Fonts">
                            <span class="material-symbols-outlined" style="font-size: 1.8rem;">open_in_new</span>
                        </a>
                    </div>
                </div>

                <div class="color-controls-grid">
                    <div class="control-item">
                        <label class="control-label" for="iconBackgroundColor">Fundo</label>
                        <div class="color-picker-box">
                            <input type="color" id="iconBackgroundColor" value="#05285B" oninput="updateColorFromPicker('bg')">
                            <input type="text" id="iconBackgroundColorText" value="#05285B" class="color-hex-text" maxlength="7" oninput="updateColorFromText('bg')">
                        </div>
                    </div>
                    <div class="control-item">
                        <label class="control-label" for="iconFontColor">Ícone</label>
                        <div class="color-picker-box">
                            <input type="color" id="iconFontColor" value="#FFFFFF" oninput="updateColorFromPicker('font')">
                            <input type="text" id="iconFontColorText" value="#FFFFFF" class="color-hex-text" maxlength="7" oninput="updateColorFromText('font')">
                        </div>
                    </div>
                </div>
            </div>

            <div class="inspector-section">
                <span class="inspector-title">Exportar Arquivos</span>
                <div class="download-actions">
                    <button type="button" class="btn-action-png" onclick="downloadPNG(128)">
                        <span>PNG</span>
                    </button>
                    <button type="button" class="btn-action-png btn-action-png-hi" onclick="downloadPNGHi()">
                        <span>PNG Hi</span>
                    </button>
                    <button type="button" class="btn-action-svg" onclick="downloadSVG()">
                        <span>SVG</span>
                    </button>
                </div>
            </div>

            <div class="inspector-footer">
                © 2026 <a href="https://weth.com.br" target="_blank">WETH Tecnologia</a>
            </div>
        </aside>
    </div>
</body>

</html>
